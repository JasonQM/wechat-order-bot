<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}订单面板{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="topbar">
    <div class="brand">订单面板 <span>微信多群自动报价</span></div>
    <nav class="nav">
      <a href="{{ url_for('dashboard') }}" class="{{ 'on' if active == 'dashboard' }}">数据面板</a>
      <a href="{{ url_for('orders') }}" class="{{ 'on' if active == 'orders' }}">订单记录</a>
      <a href="{{ url_for('manual') }}" class="{{ 'on' if active == 'manual' }}">待人工</a>
      <a href="{{ url_for('groups_page') }}" class="{{ 'on' if active == 'groups' }}">群管理</a>
      <a href="{{ url_for('reply_page') }}" class="{{ 'on' if active == 'reply' }}">回复设置</a>
    </nav>
  </div>

  <div class="wrap">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% if msgs %}
      <div class="flashes">
        {% for cat, m in msgs %}
        <div class="flash {{ cat }}">{{ m }}</div>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>

  <div id="lightbox">
    <span class="hint">点击任意处关闭</span>
    <img id="lightbox-img" alt="订单截图">
  </div>

  <script>
    document.addEventListener('click', function (e) {
      const t = e.target;
      if (t.dataset && t.dataset.zoom) {
        document.getElementById('lightbox-img').src = t.src;
        document.getElementById('lightbox').classList.add('on');
        return;
      }
      if (t.closest('#lightbox')) {
        document.getElementById('lightbox').classList.remove('on');
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('on');
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
